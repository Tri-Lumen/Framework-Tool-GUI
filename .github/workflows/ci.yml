name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's wheels bring Qt itself but not the X/EGL libraries it links
      # against, and a runner image has none of them. Without these the
      # smoke tests skip themselves silently, which would look green while
      # testing nothing.
      - name: Install Qt's system libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Install PySide6
        run: pip install -r requirements.txt

      - name: Run test suite
        run: xvfb-run -a python3 -m unittest discover tests -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned deliberately: an unpinned ruff turns CI red whenever a new
      # release promotes rules into its default set. The rule set itself
      # lives in ruff.toml. Bump both together, on purpose.
      - run: pip install ruff==0.15.8
      - run: ruff check .

  windows-build:
    name: Windows exe + installer build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The GUI smoke tests skip themselves here (their stub binary is
      # POSIX-only); every logic and packaging test does run, and none of
      # them needs the toolkit, so this deliberately installs nothing.
      - name: Run test suite
        run: python -m unittest discover tests -v

      # Same composite action the release workflow uses, so what ships on a
      # release is what CI exercised on every push - including compiling
      # installer.iss, which otherwise only gets validated at release time.
      - uses: ./.github/actions/build-windows

      - uses: actions/upload-artifact@v4
        with:
          name: FrameworkGUI-windows
          path: |
            windows/dist/FrameworkGUI.exe
            windows/dist/FrameworkGUI-Setup.exe
          if-no-files-found: error
