name: Release

# Builds the distributable artifacts and attaches them to a GitHub Release.
#
#   Publish a release (tag e.g. v1.0.0) -> this runs -> the release gets
#   FrameworkGUI-Setup.exe, FrameworkGUI.exe and FrameworkGUI.flatpak.
#
# README's download links point at /releases/latest/download/<name>, so those
# asset filenames are part of the contract - renaming one breaks the README.
#
# workflow_dispatch runs everything except the upload, so the build can be
# rehearsed without cutting a release. Artifacts are kept either way.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          raw="${{ github.event.release.tag_name }}"
          if [ -z "$raw" ]; then
            # Manual run: no tag to read a version from.
            version="0.0.0-dev"
          else
            version="${raw#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  windows:
    name: Windows exe + installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The GUI smoke tests skip themselves here (their stub binary is
      # POSIX-only); the parser and packaging tests do run.
      - name: Run test suite
        run: python -m unittest discover tests -v

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            windows/dist/FrameworkGUI.exe
            windows/dist/FrameworkGUI-Setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            windows/dist/FrameworkGUI-Setup.exe `
            windows/dist/FrameworkGUI.exe `
            --clobber

  flatpak:
    name: Linux Flatpak bundle
    runs-on: ubuntu-latest
    # The manifest installs PySide6 from pinned wheels against the KDE
    # runtime's Qt, so nothing is compiled from source any more. It is still
    # the longest job here: the runtime is a large download.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub and install the runtime
        run: |
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.kde.Platform//6.7 org.kde.Sdk//6.7

      # Keyed on the manifest: the sources it pins are the whole build input,
      # so any edit to it correctly invalidates the cache.
      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: flatpak/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/io.github.frameworkgui.FrameworkGUI.yml') }}
          restore-keys: flatpak-builder-

      - name: Build the bundle
        working-directory: flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build io.github.frameworkgui.FrameworkGUI.yml
          flatpak build-bundle repo FrameworkGUI.flatpak \
            io.github.frameworkgui.FrameworkGUI
          ls -l FrameworkGUI.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: flatpak/FrameworkGUI.flatpak
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            flatpak/FrameworkGUI.flatpak --clobber
