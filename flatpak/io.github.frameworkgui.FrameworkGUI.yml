app-id: io.github.frameworkgui.FrameworkGUI
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: framework-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # No --share=network on purpose. The Drivers section only opens links (the
  # portal handles that, no network permission needed), and the one code
  # path that downloads anything — fetching a helper's GitHub release — is
  # Windows-only. Adding it back would widen the sandbox for nothing.
  # REQUIRED: lets the app run framework_tool (and pkexec) on the HOST via
  # flatpak-spawn. EC/firmware access is impossible from inside the sandbox,
  # so this permission is the whole point of the app. It is a deliberate
  # sandbox hole - don't grant it to apps you don't trust.
  - --talk-name=org.freedesktop.Flatpak

modules:
  # The UI is PySide6. The wheels below carry Qt themselves, which is why
  # this manifest no longer compiles anything from source — the Tcl, Tk and
  # CPython modules the Tkinter version needed are gone, and with them the
  # slowest part of the build.
  #
  # The runtime is org.kde rather than org.freedesktop because the KDE one
  # already ships Qt 6 and its platform plugins (xcb, wayland) plus the
  # fonts and icon theme they expect; on the plain freedesktop runtime the
  # wheel's Qt starts but has no platform plugin to load.
  - name: python3-pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation
        --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        shiboken6 PySide6-Essentials
    sources:
      # Binary wheels, pinned by hash and fetched by flatpak-builder.
      # PySide6-Essentials rather than the full PySide6: the app uses
      # QtWidgets, QtGui and QtCore (the icons are drawn by iconpaths.py,
      # so QtSvg is not needed), and the extras (WebEngine, 3D,
      # Charts) would roughly triple the bundle for nothing.
      - type: file
        url: https://files.pythonhosted.org/packages/b2/e9/5c0c67de510da7818703d01123f7998cc495e99c0e6979a6ed6eb2ee09d0/shiboken6-6.7.3-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: f0852e5781de78be5b13c140ec4c7fb9734e2aaf2986eb2d6a224363e03efccc
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/8d/d8/a08ca6eca6839be5d604e4035ce899f9d6df0f612191f4ed4d03e51f1e0e/PySide6_Essentials-6.7.3-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: cda6fd26aead48f32e57f044d18aa75dc39265b49d7957f515ce7ac3989e7029
        only-arches: [x86_64]

  - name: framework-gui
    buildsystem: simple
    build-commands:
      - install -Dm644 framework_gui.py /app/share/framework-gui/framework_gui.py
      # The launcher imports the package beside it; every module in
      # it has to be here or the app dies on launch. flatpak-builder's
      # file sources are one file each, which is why this list is
      # explicit - tests/test_packaging.py fails when it falls behind.
      - install -Dm644 __init__.py /app/share/framework-gui/frameworkgui/__init__.py
      - install -Dm644 __main__.py /app/share/framework-gui/frameworkgui/__main__.py
      - install -Dm644 app.py /app/share/framework-gui/frameworkgui/app.py
      - install -Dm644 app_icon.py /app/share/framework-gui/frameworkgui/app_icon.py
      - install -Dm644 appstate.py /app/share/framework-gui/frameworkgui/appstate.py
      - install -Dm644 backdrop.py /app/share/framework-gui/frameworkgui/backdrop.py
      - install -Dm644 deps.py /app/share/framework-gui/frameworkgui/deps.py
      - install -Dm644 device_images.py /app/share/framework-gui/frameworkgui/device_images.py
      - install -Dm644 drivers.py /app/share/framework-gui/frameworkgui/drivers.py
      - install -Dm644 iconpaths.py /app/share/framework-gui/frameworkgui/iconpaths.py
      - install -Dm644 module_icons.py /app/share/framework-gui/frameworkgui/module_icons.py
      - install -Dm644 navigation.py /app/share/framework-gui/frameworkgui/navigation.py
      - install -Dm644 parsers.py /app/share/framework-gui/frameworkgui/parsers.py
      - install -Dm644 power.py /app/share/framework-gui/frameworkgui/power.py
      - install -Dm644 theme.py /app/share/framework-gui/frameworkgui/theme.py
      - install -Dm644 widgets.py /app/share/framework-gui/frameworkgui/widgets.py
      # The Overview's device photographs. device_images.py looks for
      # them relative to its own module, so they land inside the package.
      - install -Dm644 desktop.png
        /app/share/framework-gui/frameworkgui/assets/devices/desktop.png
      - install -Dm644 laptop-12.png
        /app/share/framework-gui/frameworkgui/assets/devices/laptop-12.png
      - install -Dm644 laptop-13.png
        /app/share/framework-gui/frameworkgui/assets/devices/laptop-13.png
      - install -Dm644 laptop-13-pro.png
        /app/share/framework-gui/frameworkgui/assets/devices/laptop-13-pro.png
      - install -Dm644 laptop-16.png
        /app/share/framework-gui/frameworkgui/assets/devices/laptop-16.png
      - install -Dm644 laptop-16-gpu.png
        /app/share/framework-gui/frameworkgui/assets/devices/laptop-16-gpu.png
      - install -Dm644 unknown.png
        /app/share/framework-gui/frameworkgui/assets/devices/unknown.png
      # The app icon, loaded at runtime for the window/taskbar mark.
      - install -Dm644 FrameworkGUI-16.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI-16.png
      - install -Dm644 FrameworkGUI-32.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI-32.png
      - install -Dm644 FrameworkGUI-48.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI-48.png
      - install -Dm644 FrameworkGUI-64.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI-64.png
      - install -Dm644 FrameworkGUI-128.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI-128.png
      - install -Dm644 FrameworkGUI-256.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI-256.png
      - install -Dm644 FrameworkGUI.png
        /app/share/framework-gui/frameworkgui/assets/icons/FrameworkGUI.png
      - install -Dm755 framework-gui /app/bin/framework-gui
      - install -Dm644 io.github.frameworkgui.FrameworkGUI.desktop
        /app/share/applications/io.github.frameworkgui.FrameworkGUI.desktop
      # Real artwork at every size the shell asks for, replacing the
      # placeholder SVG this used to ship.
      - install -Dm644 FrameworkGUI-16.png
        /app/share/icons/hicolor/16x16/apps/io.github.frameworkgui.FrameworkGUI.png
      - install -Dm644 FrameworkGUI-32.png
        /app/share/icons/hicolor/32x32/apps/io.github.frameworkgui.FrameworkGUI.png
      - install -Dm644 FrameworkGUI-48.png
        /app/share/icons/hicolor/48x48/apps/io.github.frameworkgui.FrameworkGUI.png
      - install -Dm644 FrameworkGUI-64.png
        /app/share/icons/hicolor/64x64/apps/io.github.frameworkgui.FrameworkGUI.png
      - install -Dm644 FrameworkGUI-128.png
        /app/share/icons/hicolor/128x128/apps/io.github.frameworkgui.FrameworkGUI.png
      - install -Dm644 FrameworkGUI-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.frameworkgui.FrameworkGUI.png
      - install -Dm644 LICENSE
        /app/share/licenses/io.github.frameworkgui.FrameworkGUI/LICENSE
    sources:
